buildscript {
  ext.getExtOrDefault = {name ->
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['ZaloKit_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["ZaloKit_" + name]).toInteger()
}

android {
  namespace "com.zalokit"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    consumerProguardFiles "consumer-rules.pro"
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      java.srcDirs += [
        "generated/java",
        "generated/jni"
      ]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

// The app resolves this library's `api` dependencies with its own repositories, and Zalo
// publishes current SDK versions only here (Maven Central stops at 4.2.0724).
rootProject.allprojects {
  repositories {
    maven {
      url "https://gitlab.com/api/v4/projects/50747855/packages/maven"
      content {
        includeGroup "me.zalo"
      }
    }
  }
}

def kotlin_version = getExtOrDefault("kotlinVersion")
def zalo_sdk_version = rootProject.ext.has("zaloSdkVersion") ? rootProject.ext.get("zaloSdkVersion") : project.properties["ZaloKit_zaloSdkVersion"]

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  api "me.zalo:sdk-core:$zalo_sdk_version"
  api "me.zalo:sdk-auth:$zalo_sdk_version"
  api "me.zalo:sdk-openapi:$zalo_sdk_version"
}

react {
  jsRootDir = file("../src/")
  libraryName = "ZaloKit"
  codegenJavaPackageName = "com.zalokit"
}
